<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827" />
    </marker>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="675" fill="#ffffff" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2" />

  <!-- Header Title Bar -->
  <rect x="20" y="20" width="1160" height="70" rx="12" fill="#f9fafb" stroke="#111827" stroke-width="2" />
  <line x1="20" y1="90" x2="1180" y2="90" stroke="#111827" stroke-width="2" />

  <text x="50" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#111827">SƠ ĐỒ LUỒNG XỬ LÝ - ĐIỀU PHỐI PHÒNG THI REALTIME (SERVER-AUTHORITATIVE)</text>
  <text x="50" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4b5563">Quy trình đồng bộ thời gian thực qua NestJS WebSocket Gateway, chống can thiệp đồng hồ thiết bị</text>

  <rect x="1000" y="38" width="150" height="34" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="1075" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">WORKFLOW PIPELINE</text>

  <!-- STEP 1: HOST CREATES ROOM -->
  <g transform="translate(50, 120)">
    <rect width="210" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="210" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 1: GIÁO VIÊN MỞ PHÒNG</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827">• Chọn đề thi TOEIC/IELTS</text>
    <text x="15" y="75" font-family="monospace" font-size="11" fill="#4b5563">• Tạo mã phòng: ROOM-8823</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#111827">• Cấu hình thời gian: 45 phút</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="260" y1="175" x2="330" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 2: STUDENTS JOIN ROOM -->
  <g transform="translate(330, 120)">
    <rect width="230" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="230" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="115" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 2: HỌC SINH JOIN ROOM</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Nhập Room Code qua Client</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• WebSocket handshake</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Broadcast danh sách thí sinh</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="560" y1="175" x2="630" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 3: START EXAM EVENT -->
  <g transform="translate(630, 120)">
    <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="240" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="120" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 3: HOST BẤM START</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Socket emit: 'start_exam_room'</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Server xác thực quyền Host</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#111827">✔ Khóa danh sách phòng thi</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="870" y1="175" x2="940" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 4: SERVER TIMEKEEPER -->
  <g transform="translate(940, 120)">
    <rect width="210" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="210" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 4: TIMEKEEPER KÍCH HOẠT</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Lưu startTime &amp; duration</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Broadcast đề thi đồng loạt</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4b5563">✔ Server là nguồn thời gian duy nhất</text>
  </g>

  <!-- Arrow 4 down to Step 5 -->
  <path d="M 1045 230 L 1045 370 L 980 370" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- STEP 5: SYNC TIMER TICK (Loop) -->
  <g transform="translate(680, 310)">
    <rect width="300" height="120" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="300" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="150" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 5: BROADCAST TIMER TICK</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Chu kỳ: Mỗi 1000ms Server phát xung</text>
    <text x="15" y="75" font-family="monospace" font-size="11" fill="#4b5563">server.to(roomId).emit('timer_tick')</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#111827">• Học sinh gửi snapshot câu trả lời</text>
    <text x="15" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#111827">✔ Thời gian được quản lý tập trung từ máy chủ</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="680" y1="370" x2="610" y2="370" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 6: FORCE SUBMIT EXAM -->
  <g transform="translate(360, 310)">
    <rect width="250" height="120" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="250" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="125" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 6: HẾT GIỜ (TỰ ĐỘNG THU BÀI)</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• remainingSeconds &lt;= 0</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Emit: 'force_submit_exam'</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Khóa giao diện làm bài lập tức</text>
    <text x="15" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#111827">✔ Tự động thu bài của thí sinh</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="360" y1="370" x2="280" y2="370" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 7: AUTO-GRADING & LEADERBOARD -->
  <g transform="translate(50, 310)">
    <rect width="230" height="120" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="230" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="115" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 7: AUTO-GRADE &amp; RANKING</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Chấm điểm thang TOEIC 990</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Phân tích kỹ năng Part 1-7</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#111827">• Broadcast bảng xếp hạng phòng</text>
    <text x="15" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4b5563">✔ Độ trễ hiển thị: &lt; 30ms</text>
  </g>

  <!-- Security Note Box -->
  <g transform="translate(50, 470)">
    <rect width="1100" height="85" rx="8" fill="#fafafa" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#111827">CƠ CHẾ BẢO VỆ PHÒNG THI VÀ PHỤC HỒI KHI MẤT KẾT NỐI:</text>
    <text x="25" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#374151">• Nếu học sinh vô tình mất mạng hoặc reload trình duyệt, Client tự động handshake lại qua JWT Token và nhận lại đúng thời gian còn lại của phòng thi.</text>
    <text x="25" y="73" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">• Mọi đáp án đã bấm trước đó được lưu tạm trên Redis cache phía server nên không bị mất dữ liệu.</text>
  </g>

  <!-- Footer Technical Indicators -->
  <line x1="50" y1="585" x2="1150" y2="585" stroke="#e5e7eb" stroke-width="1.5" />
  <g transform="translate(50, 605)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">CHỈ SỐ THỰC TẾ:</text>
    <text x="140" y="15" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">WebSocket Latency: &lt; 20ms</text>
    <text x="390" y="15" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">Xử lý đồng thời: 500+ thí sinh/phòng</text>
    <text x="700" y="15" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">Tốc độ chấm tự động: Tức thì (&lt; 0.1s)</text>
  </g>
</svg>

