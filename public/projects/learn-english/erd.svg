<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" /><stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="75" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#10b981">🗄️</text>
  <text x="110" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">SƠ ĐỒ THỰC THỂ QUAN HỆ (ERD) - LEARN ENGLISH WEB</text>
  <text x="110" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Cấu trúc các bảng: Users, Exams, Questions, Answers, ExamRooms, Submissions</text>
  <rect x="910" y="47" width="230" height="36" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
  <text x="1025" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">📌 [ẢNH MẪU - THAY THẾ]</text>

  <!-- Table 1: USERS -->
  <g transform="translate(60, 140)">
    <rect width="240" height="200" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="240" height="36" rx="12" fill="#1e293b"/>
    <text x="20" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa">USERS</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#e2e8f0">🔑 id (UUID - PK)</text>
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#e2e8f0">📄 email (VARCHAR)</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#e2e8f0">🔒 password_hash</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#e2e8f0">🏷️ role (TEACHER/STUDENT)</text>
    <text x="20" y="160" font-family="monospace" font-size="11" fill="#94a3b8">🕒 created_at</text>
  </g>

  <!-- Table 2: EXAMS -->
  <g transform="translate(360, 140)">
    <rect width="240" height="200" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="240" height="36" rx="12" fill="#1e293b"/>
    <text x="20" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">EXAMS</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#e2e8f0">🔑 id (UUID - PK)</text>
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#e2e8f0">🔗 creator_id (FK -> USERS)</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#e2e8f0">📝 title (VARCHAR)</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#e2e8f0">⏱️ duration_minutes</text>
    <text x="20" y="160" font-family="monospace" font-size="11" fill="#e2e8f0">🎯 type (TOEIC / IELTS)</text>
    <text x="20" y="185" font-family="monospace" font-size="11" fill="#94a3b8">🕒 created_at</text>
  </g>

  <!-- Table 3: QUESTIONS -->
  <g transform="translate(660, 140)">
    <rect width="240" height="200" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="240" height="36" rx="12" fill="#1e293b"/>
    <text x="20" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#c084fc">QUESTIONS</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#e2e8f0">🔑 id (UUID - PK)</text>
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#e2e8f0">🔗 exam_id (FK -> EXAMS)</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#e2e8f0">🔢 part_number (1 - 7)</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#e2e8f0">🔊 audio_url (TEXT)</text>
    <text x="20" y="160" font-family="monospace" font-size="11" fill="#e2e8f0">🖼️ image_url (TEXT)</text>
    <text x="20" y="185" font-family="monospace" font-size="11" fill="#e2e8f0">❓ content (TEXT)</text>
  </g>

  <!-- Table 4: ANSWERS -->
  <g transform="translate(930, 140)">
    <rect width="210" height="200" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="210" height="36" rx="12" fill="#1e293b"/>
    <text x="20" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">ANSWERS</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#e2e8f0">🔑 id (UUID - PK)</text>
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#e2e8f0">🔗 question_id (FK)</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#e2e8f0">🏷️ option_char (A,B,C,D)</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#e2e8f0">📄 text (TEXT)</text>
    <text x="20" y="160" font-family="monospace" font-size="11" fill="#10b981">✅ is_correct (BOOLEAN)</text>
  </g>

  <!-- Table 5: EXAM_ROOMS -->
  <g transform="translate(210, 380)">
    <rect width="270" height="180" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="270" height="36" rx="12" fill="#1e293b"/>
    <text x="20" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#f472b6">EXAM_ROOMS (Realtime)</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#e2e8f0">🔑 room_code (PIN - PK)</text>
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#e2e8f0">🔗 host_user_id (FK)</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#e2e8f0">🔗 exam_id (FK -> EXAMS)</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#e2e8f0">🟢 status (WAITING/ACTIVE/CLOSED)</text>
    <text x="20" y="160" font-family="monospace" font-size="11" fill="#e2e8f0">⏱️ started_at &amp; time_left</text>
  </g>

  <!-- Table 6: SUBMISSIONS -->
  <g transform="translate(600, 380)">
    <rect width="290" height="180" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="290" height="36" rx="12" fill="#1e293b"/>
    <text x="20" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">SUBMISSIONS</text>
    <text x="20" y="60" font-family="monospace" font-size="11" fill="#e2e8f0">🔑 id (UUID - PK)</text>
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#e2e8f0">🔗 user_id (FK -> USERS)</text>
    <text x="20" y="110" font-family="monospace" font-size="11" fill="#e2e8f0">🔗 exam_id (FK -> EXAMS)</text>
    <text x="20" y="135" font-family="monospace" font-size="11" fill="#facc15">🎯 score_listening &amp; score_reading</text>
    <text x="20" y="160" font-family="monospace" font-size="11" fill="#10b981">🏆 total_score (Max 990)</text>
  </g>

  <!-- Lines -->
  <line x1="300" y1="220" x2="360" y2="220" stroke="#3b82f6" stroke-width="1.5" />
  <line x1="600" y1="220" x2="660" y2="220" stroke="#06b6d4" stroke-width="1.5" />
  <line x1="900" y1="220" x2="930" y2="220" stroke="#a855f7" stroke-width="1.5" />
  <line x1="480" y1="340" x2="480" y2="380" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="550" y1="340" x2="650" y2="380" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Replacement Bar -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="626" font-family="monospace" font-size="13" fill="#38bdf8">💡 Để thay bằng ảnh thật của bạn:</text>
  <text x="320" y="626" font-family="monospace" font-size="13" fill="#e2e8f0">Chép file ảnh của bạn đè lên đường dẫn: </text>
  <text x="645" y="626" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">e:\portfolio\public\projects\learn-english\erd.svg (hoặc .png)</text>
</svg>

