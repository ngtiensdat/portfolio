  <rect x="85" y="155" width="710" height="50" rx="12" fill="#0f172a" />
  <text x="110" y="186" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">ĐỀ THI TOEIC MINI-TEST 01 (Part 1 - 4)</text>
  <rect x="630" y="165" width="145" height="30" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" />
  <text x="702" y="185" font-family="monospace" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">⏱️ 44:28 còn lại</text>

  <!-- Audio Player Mock -->
  <rect x="85" y="225" width="710" height="55" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <circle cx="120" cy="252" r="16" fill="#3b82f6" />
  <polygon points="115,244 115,260 128,252" fill="#ffffff" />
  <line x1="160" y1="252" x2="650" y2="252" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="252" x2="380" y2="252" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  <circle cx="380" cy="252" r="7" fill="#60a5fa" />
  <text x="730" y="257" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">01:15 / 02:45</text>

