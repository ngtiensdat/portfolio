  </g>
  <g transform="translate(110, 450)">
    <rect width="660" height="35" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">C. No, she is at the main entrance desk.</text>
  </g>
  <g transform="translate(110, 495)">
    <rect width="660" height="35" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">D. In the second floor conference hall.</text>
  </g>

