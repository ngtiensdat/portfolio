    <text x="25" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">L</text>
    <text x="48" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Lê Thuỳ Linh</text>
    <text x="48" y="37" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Đang trả lời câu 14/50</text>
  </g>
  <g transform="translate(875, 400)">
    <rect width="240" height="45" rx="10" fill="#0f172a" stroke="#334155" />
    <circle cx="25" cy="22" r="12" fill="#f59e0b" />
    <text x="25" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">V</text>
    <text x="48" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Phạm Quang Vinh</text>
    <text x="48" y="37" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Đang trả lời câu 09/50</text>
