  <rect x="85" y="300" width="710" height="245" rx="12" fill="#0f172a" />
  <text x="110" y="335" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">Câu 12: Listen to the audio and choose the best response:</text>
  
  <g transform="translate(110, 360)">
    <rect width="660" height="35" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="20" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">A. Yes, the meeting was postponed until 3:00 PM.</text>
  </g>
  <g transform="translate(110, 405)">
    <rect width="660" height="35" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
