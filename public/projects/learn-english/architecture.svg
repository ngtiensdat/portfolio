  <text x="495" y="265" font-family="monospace" font-size="11" fill="#7dd3fc">• Server-Authoritative Timer (Tick/s)</text>
  <text x="495" y="287" font-family="monospace" font-size="11" fill="#7dd3fc">• Force submit when countdown = 0</text>

  <rect x="475" y="325" width="320" height="95" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="635" y="353" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Auto-Grading &amp; Scoring Engine</text>
  <text x="495" y="380" font-family="monospace" font-size="11" fill="#94a3b8">• Chấm điểm tự động thang 990 TOEIC</text>
  <text x="495" y="402" font-family="monospace" font-size="11" fill="#94a3b8">• Thống kê độ chính xác từng Part</text>

  <rect x="475" y="440" width="320" height="95" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="635" y="468" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Auth &amp; RBAC Module</text>
  <text x="495" y="495" font-family="monospace" font-size="11" fill="#94a3b8">• JWT Authentication &amp; Guard</text>
  <text x="495" y="517" font-family="monospace" font-size="11" fill="#94a3b8">• Teacher / Student Role Claims</text>

  <!-- Connectors to DB -->
  <line x1="820" y1="350" x2="900" y2="350" stroke="#10b981" stroke-width="2" />
  <text x="860" y="340" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">Prisma</text>

  <!-- Layer 3: Database & Storage -->
  <rect x="900" y="140" width="240" height="420" rx="20" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
  <text x="1020" y="180" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">DATABASE &amp; STORAGE</text>

  <rect x="925" y="210" width="190" height="150" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
  <text x="1020" y="240" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">PostgreSQL Database</text>
  <text x="945" y="270" font-family="monospace" font-size="11" fill="#a7f3d0">• Users &amp; Roles</text>
  <text x="945" y="295" font-family="monospace" font-size="11" fill="#a7f3d0">• Exams &amp; Questions</text>
  <text x="945" y="320" font-family="monospace" font-size="11" fill="#a7f3d0">• Submissions</text>
  <text x="945" y="345" font-family="monospace" font-size="11" fill="#a7f3d0">• Exam Rooms</text>

  <rect x="925" y="380" width="190" height="155" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="1020" y="410" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Static Audio CDN</text>
  <text x="945" y="440" font-family="monospace" font-size="11" fill="#94a3b8">• File MP3 Listening</text>
  <text x="945" y="465" font-family="monospace" font-size="11" fill="#94a3b8">• Ảnh minh họa Part 1</text>
  <text x="945" y="490" font-family="monospace" font-size="11" fill="#94a3b8">• Vercel Blob / Static</text>

  <!-- Bottom File Replacement Guide -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
