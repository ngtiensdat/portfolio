<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="75" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">🏗️</text>
  <text x="110" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">KIẾN TRÚC PHÒNG THI REALTIME &amp; MICROSERVICES - LEARN ENGLISH</text>
  <text x="110" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Cơ chế đồng bộ thời gian thực qua NestJS WebSocket Gateway (Socket.io) &amp; Server-Authoritative Timer</text>
  <rect x="910" y="47" width="230" height="36" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
  <text x="1025" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">📌 [ẢNH MẪU - THAY THẾ]</text>

  <!-- Layer 1: Client Next.js -->
  <rect x="60" y="140" width="300" height="420" rx="20" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2" />
  <text x="210" y="180" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">CLIENT APPS (Next.js 14)</text>
  <rect x="85" y="210" width="250" height="75" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="210" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Học Sinh (Student UI)</text>
  <text x="210" y="260" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Làm bài thi, Nghe Audio, Nộp bài</text>

  <rect x="85" y="305" width="250" height="75" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="210" y="333" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Giáo Viên (Host Portal)</text>
  <text x="210" y="355" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Mở phòng thi, Giám sát phòng thi</text>

  <rect x="85" y="400" width="250" height="135" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="210" y="428" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Client State &amp; Audio</text>
  <text x="105" y="455" font-family="monospace" font-size="11" fill="#38bdf8">• Socket.io-client</text>
  <text x="105" y="480" font-family="monospace" font-size="11" fill="#38bdf8">• HTML5 Audio Player API</text>
  <text x="105" y="505" font-family="monospace" font-size="11" fill="#38bdf8">• Tailwind CSS Responsive UI</text>

  <!-- Connectors -->
  <line x1="360" y1="280" x2="450" y2="280" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" />
  <text x="405" y="270" font-family="monospace" font-size="10" fill="#06b6d4" text-anchor="middle">WSS</text>
  <line x1="360" y1="380" x2="450" y2="380" stroke="#3b82f6" stroke-width="2" />
  <text x="405" y="370" font-family="monospace" font-size="10" fill="#3b82f6" text-anchor="middle">REST API</text>

  <!-- Layer 2: NestJS WebSocket Gateway & Services -->
  <rect x="450" y="140" width="370" height="420" rx="20" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="2" />
  <text x="635" y="180" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">BACKEND SERVICES (NestJS)</text>

  <rect x="475" y="210" width="320" height="95" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
