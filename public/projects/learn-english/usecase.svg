<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="675" fill="#ffffff" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2" />

  <!-- Header Title Bar -->
  <rect x="20" y="20" width="1160" height="70" rx="12" fill="#f9fafb" stroke="#111827" stroke-width="2" />
  <line x1="20" y1="90" x2="1180" y2="90" stroke="#111827" stroke-width="2" />

  <text x="50" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#111827">SƠ ĐỒ USE CASE - HỆ THỐNG LEARN ENGLISH WEB</text>
  <text x="50" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4b5563">Phân hệ Học sinh (Thí sinh), Giáo viên (Host đề thi) &amp; Bộ điều phối phòng thi trực tuyến</text>

  <rect x="1000" y="38" width="150" height="34" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="1075" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">UML USE CASE</text>

  <!-- ==================== LEFT ACTORS ==================== -->
  <!-- Actor 1: Học sinh -->
  <g transform="translate(90, 150)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="36" x2="40" y2="85" stroke="#111827" stroke-width="2.5" />
    <line x1="12" y1="52" x2="68" y2="52" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="18" y2="125" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="62" y2="125" stroke="#111827" stroke-width="2.5" />
    <text x="40" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="middle">HỌC SINH</text>
    <text x="40" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle">(Thí sinh luyện thi)</text>
  </g>

  <!-- Actor 2: Giáo viên -->
  <g transform="translate(90, 400)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="36" x2="40" y2="85" stroke="#111827" stroke-width="2.5" />
    <line x1="12" y1="52" x2="68" y2="52" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="18" y2="125" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="62" y2="125" stroke="#111827" stroke-width="2.5" />
    <text x="40" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="middle">GIÁO VIÊN</text>
    <text x="40" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle">(Người ra đề / Host)</text>
  </g>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect x="250" y="115" width="700" height="520" rx="16" fill="#fafafa" stroke="#111827" stroke-width="2" stroke-dasharray="8 6" />
  <text x="600" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#374151" text-anchor="middle" letter-spacing="1">LEARN ENGLISH APPLICATION SYSTEM</text>

  <!-- ==================== USE CASES (OVALS) ==================== -->
  <!-- UC1: Thi thử TOEIC trắc nghiệm -->
  <ellipse cx="440" cy="195" rx="140" ry="28" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Thi trắc nghiệm TOEIC / IELTS</text>

  <!-- UC2: Tham gia phòng thi Real-time -->
  <ellipse cx="440" cy="275" rx="140" ry="30" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Vào phòng thi trực tuyến</text>
  <text x="440" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(Tham gia bằng mã Room Code)</text>

  <!-- UC3: Xem phổ điểm & phân tích -->
  <ellipse cx="440" cy="365" rx="140" ry="28" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Xem phân tích điểm &amp; Lỗi sai</text>

  <!-- UC4: Quản lý ngân hàng câu hỏi -->
  <ellipse cx="440" cy="455" rx="140" ry="30" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Soạn đề &amp; Quản lý câu hỏi</text>
  <text x="440" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(Upload Audio, Ảnh &amp; Đáp án)</text>

  <!-- UC5: Điều hành phòng thi (Host) -->
  <ellipse cx="440" cy="545" rx="140" ry="28" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Mở phòng thi &amp; Bấm Bắt đầu</text>

  <!-- UC6: Đồng bộ đếm ngược thời gian (Include) -->
  <ellipse cx="760" cy="275" rx="135" ry="30" fill="#ffffff" stroke="#111827" stroke-width="1.8" stroke-dasharray="5 4" />
  <text x="760" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Đồng bộ đếm ngược từ Server</text>
  <text x="760" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">(Server-Authoritative Timekeeper)</text>

  <!-- UC7: Chấm điểm & Xếp hạng tức thì -->
  <ellipse cx="760" cy="385" rx="135" ry="30" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="760" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Chấm điểm tự động &amp; Xếp hạng</text>
  <text x="760" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">(Realtime Leaderboard Broadcast)</text>

  <!-- UC8: Tự động thu bài khi hết giờ (Include) -->
  <ellipse cx="760" cy="180" rx="135" ry="28" fill="#ffffff" stroke="#111827" stroke-width="1.8" stroke-dasharray="5 4" />
  <text x="760" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Tự động thu bài khi hết giờ</text>
  <text x="760" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">(Đồng bộ thời gian máy chủ)</text>

  <!-- ==================== RIGHT ACTORS ==================== -->
  <!-- Actor 3: WebSocket Server Timekeeper -->
  <g transform="translate(1010, 220)">
    <rect x="0" y="0" width="85" height="70" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <circle cx="42" cy="35" r="22" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <line x1="42" y1="35" x2="42" y2="20" stroke="#111827" stroke-width="2" />
    <line x1="42" y1="35" x2="52" y2="35" stroke="#111827" stroke-width="2" />
    <text x="42" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#111827" text-anchor="middle">&lt;&lt;Server&gt;&gt;</text>
    <text x="42" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">TIMEKEEPER</text>
    <text x="42" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(NestJS Gateway)</text>
  </g>

  <!-- Actor 4: Grading Engine -->
  <g transform="translate(1010, 420)">
    <rect x="0" y="0" width="85" height="70" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <path d="M 25 35 L 37 47 L 60 22" fill="none" stroke="#111827" stroke-width="3" />
    <text x="42" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#111827" text-anchor="middle">&lt;&lt;System&gt;&gt;</text>
    <text x="42" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">GRADING BOT</text>
    <text x="42" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(Instant Scorer)</text>
  </g>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Học sinh connects -->
  <line x1="170" y1="205" x2="300" y2="198" stroke="#111827" stroke-width="1.8" />
  <line x1="170" y1="220" x2="305" y2="265" stroke="#111827" stroke-width="1.8" />
  <line x1="170" y1="235" x2="305" y2="355" stroke="#111827" stroke-width="1.8" />

  <!-- Giáo viên connects -->
  <line x1="170" y1="465" x2="305" y2="455" stroke="#111827" stroke-width="1.8" />
  <line x1="170" y1="485" x2="305" y2="540" stroke="#111827" stroke-width="1.8" />

  <!-- Includes -->
  <line x1="580" y1="275" x2="625" y2="275" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)" />
  <text x="590" y="265" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">&lt;&lt;include&gt;&gt;</text>

  <line x1="760" y1="245" x2="760" y2="215" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)" />
  <text x="765" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">&lt;&lt;extend&gt;&gt;</text>

  <!-- Right connections -->
  <line x1="1010" y1="265" x2="895" y2="275" stroke="#111827" stroke-width="1.8" />
  <line x1="1010" y1="455" x2="895" y2="400" stroke="#111827" stroke-width="1.8" />
</svg>
