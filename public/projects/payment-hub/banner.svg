<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Center Glow -->
  <circle cx="600" cy="300" r="280" fill="#2563eb" fill-opacity="0.12" filter="blur(60px)" />

  <!-- App Header Bar -->
  <rect x="60" y="40" width="1080" height="60" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
  <circle cx="95" cy="70" r="10" fill="#3b82f6" />
  <text x="120" y="75" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">PAYMENT HUB ENTERPRISE MIDDLEWARE (PMH)</text>
  <rect x="960" y="55" width="160" height="30" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" />
  <text x="1040" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">ACTIVE • SECURE</text>

  <!-- Big Hero Graphic -->
  <g transform="translate(150, 150)">
    <rect width="900" height="400" rx="24" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="2" />
    
    <!-- Top badge -->
    <rect x="350" y="35" width="200" height="30" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" />
    <text x="450" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">BANKING &amp; FINTECH CORE</text>

    <text x="450" y="115" font-family="system-ui, sans-serif" font-size="34" font-weight="extrabold" fill="#ffffff" text-anchor="middle">Payment Hub Middleware</text>
    <text x="450" y="150" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Trung Gian Thanh Toán Doanh Nghiệp Chịu Tải Cao &amp; Bảo Mật Ngân Hàng</text>

    <!-- 3 Core Pillars -->
    <g transform="translate(45, 190)">
      <rect width="250" height="150" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="125" y="45" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🚀</text>
      <text x="125" y="80" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">1.000.000+ Bản Ghi</text>
      <text x="125" y="105" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Xuất Excel SXSSF Stream</text>
      <text x="125" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">Apache Kafka + MinIO S3</text>
    </g>

    <g transform="translate(325, 190)">
      <rect width="250" height="150" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="125" y="45" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🛡️</text>
      <text x="125" y="80" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">Maker - Checker</text>
      <text x="125" y="105" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Phê duyệt 2 cấp chuẩn hóa</text>
      <text x="125" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Oracle Stored Procedures</text>
    </g>

    <g transform="translate(605, 190)">
      <rect width="250" height="150" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="125" y="45" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">⚡</text>
      <text x="125" y="80" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">Spring Security 6</text>
      <text x="125" y="105" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">JWT HttpOnly + Blacklist</text>
      <text x="125" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#c084fc" text-anchor="middle">Bucket4j Rate Limiting</text>
    </g>
  </g>

  <!-- Bottom File Replacement Guide -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="626" font-family="monospace" font-size="13" fill="#38bdf8">💡 Để thay bằng ảnh thật của bạn:</text>
  <text x="320" y="626" font-family="monospace" font-size="13" fill="#e2e8f0">Chép file ảnh của bạn đè lên đường dẫn: </text>
  <text x="645" y="626" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">e:\portfolio\public\projects\payment-hub\banner.svg (hoặc .png)</text>
</svg>

