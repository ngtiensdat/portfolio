    <text x="110" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">UC01: Khởi tạo cấu phần thanh toán</text>
  </g>
  <g transform="translate(620, 190)">
