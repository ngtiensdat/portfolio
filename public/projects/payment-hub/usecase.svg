    <text x="110" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">UC02: Phê duyệt / Từ chối (Checker)</text>
  </g>
  <g transform="translate(370, 280)">
    <ellipse cx="110" cy="30" rx="105" ry="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">UC03: Quản lý danh mục theo nhóm</text>
  </g>
  <g transform="translate(620, 280)">
    <ellipse cx="110" cy="30" rx="105" ry="26" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">UC04: Xuất báo cáo giao dịch (Kafka)</text>
  </g>
  <g transform="translate(495, 370)">
    <ellipse cx="110" cy="30" rx="105" ry="26" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="110" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">UC05: Tra cứu Audit Log kiểm toán</text>
  </g>
  <g transform="translate(495, 455)">
    <ellipse cx="110" cy="30" rx="105" ry="26" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">UC06: Đồng bộ dữ liệu Core Banking</text>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="220" x2="370" y2="220" stroke="#3b82f6" stroke-width="1.5" />
  <line x1="280" y1="310" x2="370" y2="310" stroke="#3b82f6" stroke-width="1.5" />
  <line x1="280" y1="430" x2="620" y2="310" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3"/>

  <line x1="920" y1="220" x2="830" y2="220" stroke="#a855f7" stroke-width="1.5" />
  <line x1="920" y1="310" x2="830" y2="310" stroke="#10b981" stroke-width="1.5" />
  <line x1="920" y1="400" x2="715" y2="400" stroke="#ec4899" stroke-width="1.5" />

  <!-- Right Actor: Checker -->
  <rect x="920" y="140" width="220" height="420" rx="20" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
  <circle cx="1030" cy="195" r="30" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="2" />
  <circle cx="1030" cy="185" r="12" fill="#c084fc" />
  <path d="M 1010 215 Q 1030 200 1050 215" stroke="#c084fc" stroke-width="3" fill="none" />
  <text x="1030" y="250" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">CHECKER</text>
  <text x="1030" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Người kiểm soát)</text>

  <g transform="translate(940, 310)">
    <rect width="180" height="35" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Xem dữ liệu chờ duyệt</text>
  </g>
  <g transform="translate(940, 360)">
    <rect width="180" height="35" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">So sánh NEW_DATA vs OLD</text>
  </g>
  <g transform="translate(940, 410)">
    <rect width="180" height="35" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Thực thi Stored Procedure</text>
  </g>

  <!-- Bottom File Replacement Guide -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="626" font-family="monospace" font-size="13" fill="#38bdf8">💡 Để thay bằng ảnh thật của bạn:</text>
  <text x="320" y="626" font-family="monospace" font-size="13" fill="#e2e8f0">Chép file ảnh của bạn đè lên đường dẫn: </text>
  <text x="645" y="626" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">e:\portfolio\public\projects\payment-hub\usecase.svg (hoặc .png)</text>
