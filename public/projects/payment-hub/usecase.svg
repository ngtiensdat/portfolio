<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" /><stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="75" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#3b82f6">🎯</text>
  <text x="110" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">SƠ ĐỒ USE CASE HỆ THỐNG - PAYMENT HUB (PMH)</text>
  <text x="110" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Phân quyền chức năng Maker (Khởi tạo), Checker (Kiểm soát) và Quản trị viên hệ thống</text>
  <rect x="910" y="47" width="230" height="36" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
  <text x="1025" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">📌 [ẢNH MẪU - THAY THẾ]</text>

  <!-- Left Actor: Maker -->
  <rect x="60" y="140" width="220" height="420" rx="20" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" />
  <circle cx="170" cy="195" r="30" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="2" />
  <circle cx="170" cy="185" r="12" fill="#60a5fa" />
  <path d="M 150 215 Q 170 200 190 215" stroke="#60a5fa" stroke-width="3" fill="none" />
  <text x="170" y="250" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MAKER</text>
  <text x="170" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Nhân viên khởi tạo)</text>

  <g transform="translate(80, 310)">
    <rect width="180" height="35" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Thêm mới Cấu phần / Tham số</text>
  </g>
  <g transform="translate(80, 360)">
    <rect width="180" height="35" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Chỉnh sửa tham số (Lưu tạm)</text>
  </g>
  <g transform="translate(80, 410)">
    <rect width="180" height="35" rx="8" fill="#1e293b" stroke="#475569" />
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Yêu cầu xuất 1M+ báo cáo</text>
  </g>

  <!-- Center System Boundary -->
  <rect x="330" y="130" width="540" height="440" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-dasharray="6 6" stroke-width="2" />
  <text x="600" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#64748b" text-anchor="middle">PAYMENT HUB MIDDLEWARE SYSTEM</text>

