<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="675" fill="#ffffff" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2" />

  <!-- Header Title Bar -->
  <rect x="20" y="20" width="1160" height="70" rx="12" fill="#f9fafb" stroke="#111827" stroke-width="2" />
  <line x1="20" y1="90" x2="1180" y2="90" stroke="#111827" stroke-width="2" />

  <text x="50" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#111827">SƠ ĐỒ USE CASE - HỆ THỐNG PAYMENT HUB (PMH)</text>
  <text x="50" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4b5563">Phân hệ quy trình Maker-Checker, Báo cáo dữ liệu lớn triệu dòng &amp; Audit Log độc lập</text>

  <rect x="1000" y="38" width="150" height="34" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="1075" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">UML USE CASE</text>

  <!-- ==================== LEFT ACTORS ==================== -->
  <!-- Actor 1: Maker -->
  <g transform="translate(90, 150)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="36" x2="40" y2="85" stroke="#111827" stroke-width="2.5" />
    <line x1="12" y1="52" x2="68" y2="52" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="18" y2="125" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="62" y2="125" stroke="#111827" stroke-width="2.5" />
    <text x="40" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="middle">MAKER</text>
    <text x="40" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle">(Người khởi tạo)</text>
  </g>

  <!-- Actor 2: Checker -->
  <g transform="translate(90, 400)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="36" x2="40" y2="85" stroke="#111827" stroke-width="2.5" />
    <line x1="12" y1="52" x2="68" y2="52" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="18" y2="125" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="62" y2="125" stroke="#111827" stroke-width="2.5" />
    <text x="40" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="middle">CHECKER</text>
    <text x="40" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle">(Kiểm soát viên)</text>
  </g>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect x="250" y="115" width="700" height="520" rx="16" fill="#fafafa" stroke="#111827" stroke-width="2" stroke-dasharray="8 6" />
  <text x="600" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#374151" text-anchor="middle" letter-spacing="1">PAYMENT HUB MIDDLEWARE</text>

  <!-- ==================== USE CASES (OVALS) ==================== -->
  <!-- UC1: Thêm mới tham số / cấu phần -->
  <ellipse cx="440" cy="195" rx="140" ry="28" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Thêm mới Cấu phần thanh toán</text>

  <!-- UC2: Chỉnh sửa cấu phần (Maker) -->
  <ellipse cx="440" cy="275" rx="140" ry="30" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Cập nhật cấu phần (Lưu NEW_DATA)</text>
  <text x="440" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(Trạng thái: PENDING_UPDATE)</text>

  <!-- UC3: Phê duyệt Maker-Checker -->
  <ellipse cx="440" cy="365" rx="140" ry="30" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Phê duyệt / Từ chối thay đổi</text>
  <text x="440" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(Kiểm soát 2 cấp độc lập)</text>

  <!-- UC4: Yêu cầu xuất 1M+ báo cáo -->
  <ellipse cx="440" cy="455" rx="140" ry="30" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Xuất dữ liệu 1.000.000+ giao dịch</text>
  <text x="440" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(Bất đồng bộ qua Apache Kafka)</text>

  <!-- UC5: Giám sát tiến độ realtime -->
  <ellipse cx="440" cy="545" rx="140" ry="28" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="440" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Theo dõi tiến độ xuất (WebSocket)</text>

  <!-- UC6: Gọi Oracle Stored Proc (Include) -->
  <ellipse cx="760" cy="340" rx="135" ry="30" fill="#ffffff" stroke="#111827" stroke-width="1.8" stroke-dasharray="5 4" />
  <text x="760" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Oracle Stored Procedure</text>
  <text x="760" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">(PROC_APPROVE_COMPONENT)</text>

  <!-- UC7: Stream SXSSF & MinIO S3 (Include) -->
  <ellipse cx="760" cy="455" rx="135" ry="30" fill="#ffffff" stroke="#111827" stroke-width="1.8" stroke-dasharray="5 4" />
  <text x="760" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">SXSSF Streaming &amp; MinIO Upload</text>
  <text x="760" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">(Sinh Pre-signed URL an toàn)</text>

  <!-- UC8: Ghi Audit Log độc lập -->
  <ellipse cx="760" cy="225" rx="135" ry="30" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <text x="760" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">Ghi Audit Log vết thao tác</text>
  <text x="760" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#4b5563" text-anchor="middle">(PROPAGATION_REQUIRES_NEW)</text>

  <!-- ==================== RIGHT ACTORS ==================== -->
  <!-- Actor 3: Core Banking / DB System -->
  <g transform="translate(1015, 220)">
    <rect x="0" y="0" width="85" height="70" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <path d="M 15 25 C 15 20, 70 20, 70 25 C 70 30, 15 30, 15 25 Z" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <path d="M 15 25 L 15 45 C 15 50, 70 50, 70 45 L 70 25" fill="none" stroke="#111827" stroke-width="1.5" />
    <text x="42" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#111827" text-anchor="middle">&lt;&lt;System&gt;&gt;</text>
    <text x="42" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">ORACLE DB</text>
    <text x="42" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4b5563" text-anchor="middle">(Core Database)</text>
  </g>

  <!-- Actor 4: Quản trị viên / Kiểm toán -->
  <g transform="translate(1030, 440)">
    <circle cx="40" cy="20" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="36" x2="40" y2="85" stroke="#111827" stroke-width="2.5" />
    <line x1="12" y1="52" x2="68" y2="52" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="18" y2="125" stroke="#111827" stroke-width="2.5" />
    <line x1="40" y1="85" x2="62" y2="125" stroke="#111827" stroke-width="2.5" />
    <text x="40" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="middle">AUDITOR</text>
    <text x="40" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle">(Kiểm toán / Admin)</text>
  </g>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Maker connects -->
  <line x1="170" y1="205" x2="300" y2="198" stroke="#111827" stroke-width="1.8" />
  <line x1="170" y1="220" x2="305" y2="265" stroke="#111827" stroke-width="1.8" />
  <line x1="170" y1="235" x2="320" y2="435" stroke="#111827" stroke-width="1.8" />

  <!-- Checker connects -->
  <line x1="170" y1="465" x2="305" y2="375" stroke="#111827" stroke-width="1.8" />
  <line x1="170" y1="485" x2="305" y2="465" stroke="#111827" stroke-width="1.8" />
  <line x1="170" y1="500" x2="305" y2="540" stroke="#111827" stroke-width="1.8" />

  <!-- Includes -->
  <line x1="580" y1="365" x2="625" y2="350" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)" />
  <text x="590" y="345" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">&lt;&lt;include&gt;&gt;</text>

  <line x1="580" y1="455" x2="625" y2="455" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)" />
  <text x="590" y="445" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4b5563">&lt;&lt;include&gt;&gt;</text>

  <!-- Right connections -->
  <line x1="1015" y1="260" x2="895" y2="330" stroke="#111827" stroke-width="1.8" />
  <line x1="1030" y1="500" x2="895" y2="240" stroke="#111827" stroke-width="1.8" />
</svg>
