<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" /><stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="75" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#34d399">🛡️</text>
  <text x="110" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">SƠ ĐỒ TUẦN TỰ PHÊ DUYỆT MAKER - CHECKER - PAYMENT HUB</text>
  <text x="110" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Quy trình kiểm duyệt 2 cấp: Đóng gói JSON vào NEW_DATA và thực thi Oracle Stored Procedure</text>
  <rect x="910" y="47" width="230" height="36" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
  <text x="1025" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">📌 [ẢNH MẪU - THAY THẾ]</text>

  <!-- Lifeline Headers -->
  <!-- 1. Maker -->
  <g transform="translate(100, 130)">
    <rect width="140" height="40" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">Maker (Khởi tạo)</text>
    <line x1="70" y1="40" x2="70" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- 2. Spring Controller & Service -->
  <g transform="translate(350, 130)">
    <rect width="180" height="40" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">ComponentService</text>
    <line x1="90" y1="40" x2="90" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- 3. Oracle DB -->
  <g transform="translate(640, 130)">
    <rect width="180" height="40" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">Oracle DB (Procedure)</text>
    <line x1="90" y1="40" x2="90" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- 4. Checker -->
  <g transform="translate(930, 130)">
    <rect width="140" height="40" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="70" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">Checker (Kiểm soát)</text>
    <line x1="70" y1="40" x2="70" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Step 1: Maker Update -->
  <line x1="170" y1="200" x2="440" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="220" y="180" width="180" height="20" rx="4" fill="#0f172a" />
  <text x="310" y="195" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">1. PUT /components (Sửa)</text>

  <!-- Step 2: Save to NEW_DATA -->
  <path d="M 440 220 L 480 220 L 480 240 L 440 240" fill="none" stroke="#10b981" stroke-width="1.5" />
  <text x="490" y="235" font-family="monospace" font-size="10" fill="#a7f3d0">2. Lưu JSON vào NEW_DATA (PENDING_UPDATE)</text>

  <!-- Step 3: Response to Maker -->
  <line x1="440" y1="265" x2="170" y2="265" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="310" y="260" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">3. 200 OK (Chờ Checker duyệt)</text>

  <!-- Step 4: Checker clicks Approve -->
  <line x1="1000" y1="310" x2="440" y2="310" stroke="#a855f7" stroke-width="2" />
  <rect x="620" y="295" width="220" height="20" rx="4" fill="#0f172a" />
  <text x="730" y="310" font-family="monospace" font-size="10" fill="#e9d5ff" text-anchor="middle">4. POST /approve (Checker duyệt)</text>

  <!-- Step 5: Check identity (Maker != Checker) -->
  <path d="M 440 335 L 480 335 L 480 355 L 440 355" fill="none" stroke="#10b981" stroke-width="1.5" />
  <text x="490" y="350" font-family="monospace" font-size="10" fill="#facc15">5. Validate: Maker != Checker (Không tự duyệt)</text>

  <!-- Step 6: Call Stored Procedure -->
  <line x1="440" y1="385" x2="730" y2="385" stroke="#f59e0b" stroke-width="2" />
  <rect x="470" y="370" width="230" height="20" rx="4" fill="#0f172a" />
  <text x="585" y="385" font-family="monospace" font-size="10" fill="#fde68a" text-anchor="middle">6. PROC_APPROVE_COMPONENT(id)</text>

  <!-- Step 7: DB confirms & Audit log -->
  <line x1="730" y1="420" x2="440" y2="420" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="585" y="415" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">7. P_ERR_CODE = "00" (Thành công)</text>

  <!-- Step 8: Notify Checker & Audit -->
  <line x1="440" y1="455" x2="1000" y2="455" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="730" y="450" font-family="monospace" font-size="10" fill="#e9d5ff" text-anchor="middle">8. Phê duyệt hoàn tất &amp; Ghi AuditLog</text>

  <!-- Bottom File Replacement Guide -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="626" font-family="monospace" font-size="13" fill="#38bdf8">💡 Để thay bằng ảnh thật của bạn:</text>
  <text x="320" y="626" font-family="monospace" font-size="13" fill="#e2e8f0">Chép file ảnh của bạn đè lên đường dẫn: </text>
  <text x="645" y="626" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">e:\portfolio\public\projects\payment-hub\sequence-maker-checker.svg (hoặc .png)</text>
</svg>
