<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" /><stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="75" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">🏗️</text>
  <text x="110" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">KIẾN TRÚC EVENT-DRIVEN XUẤT 1.000.000+ GIAO DỊCH - PAYMENT HUB</text>
  <text x="110" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Luồng xử lý bất đồng bộ kết hợp Spring Boot, Apache Kafka, SXSSF Streaming Excel &amp; MinIO Object Storage</text>
  <rect x="910" y="47" width="230" height="36" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
  <text x="1025" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">📌 [ẢNH MẪU - THAY THẾ]</text>

  <!-- Node 1: Angular Client -->
  <g transform="translate(60, 140)">
    <rect width="180" height="420" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2" />
    <text x="90" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">CLIENT (Angular 17)</text>
    
    <rect x="20" y="70" width="140" height="80" rx="10" fill="#0f172a" stroke="#475569" />
    <text x="90" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1. Bấm Export</text>
    <text x="90" y="125" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">POST /api/export</text>

    <rect x="20" y="180" width="140" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" />
    <text x="90" y="210" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">2. Nhận 200 OK</text>
    <text x="90" y="235" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">&lt; 50ms latency</text>
    <text x="90" y="255" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Lắng nghe WebSocket</text>

    <rect x="20" y="300" width="140" height="95" rx="10" fill="#0f172a" stroke="#10b981" />
    <text x="90" y="330" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">3. Tải File</text>
    <text x="90" y="355" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Nhận Pre-signed S3</text>
    <text x="90" y="375" font-family="system-ui, sans-serif" font-size="10" fill="#facc15" text-anchor="middle">Tự động tải về UI</text>
  </g>

  <!-- Node 2: Spring Boot API Server -->
  <g transform="translate(290, 140)">
    <rect width="210" height="420" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
    <text x="105" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">API SERVER</text>
    <text x="105" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Spring Boot 3 / Java 17</text>

    <rect x="20" y="90" width="170" height="85" rx="10" fill="#0f172a" stroke="#059669" />
    <text x="105" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Ghi nhận ExportJob</text>
    <text x="105" y="145" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">status = PENDING</text>

    <rect x="20" y="210" width="170" height="175" rx="10" fill="#0f172a" stroke="#475569" />
    <text x="105" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Đẩy Message vào Kafka</text>
    <text x="105" y="270" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">KafkaProducer.send()</text>
    <text x="105" y="295" font-family="monospace" font-size="10" fill="#facc15" text-anchor="middle">topic: "export_jobs"</text>
    <text x="105" y="335" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Giải phóng luồng HTTP</text>
    <text x="105" y="355" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Không gây treo cổng</text>
  </g>

  <!-- Node 3: Apache Kafka -->
  <g transform="translate(540, 200)">
    <rect width="130" height="300" rx="16" fill="#1e1e38" stroke="#a855f7" stroke-width="2" />
    <text x="65" y="50" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">📨</text>
    <text x="65" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">APACHE KAFKA</text>
    <text x="65" y="115" font-family="monospace" font-size="10" fill="#e9d5ff" text-anchor="middle">export_jobs</text>
    
    <rect x="15" y="145" width="100" height="35" rx="6" fill="#2e1065" stroke="#a855f7" />
    <text x="65" y="167" font-family="monospace" font-size="10" fill="#f5d0fe" text-anchor="middle">Queue Partition</text>

    <rect x="15" y="195" width="100" height="35" rx="6" fill="#2e1065" stroke="#a855f7" />
    <text x="65" y="217" font-family="monospace" font-size="10" fill="#f5d0fe" text-anchor="middle">Zero-Loss Msg</text>
  </g>

  <!-- Node 4: Worker Cluster -->
  <g transform="translate(710, 140)">
    <rect width="210" height="420" rx="16" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="2" />
    <text x="105" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f472b6" text-anchor="middle">WORKER CLUSTER</text>
    <text x="105" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Apache POI SXSSF Stream</text>

    <rect x="20" y="85" width="170" height="90" rx="10" fill="#0f172a" stroke="#db2777" />
    <text x="105" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Keyset Query (Batch)</text>
    <text x="105" y="135" font-family="monospace" font-size="9" fill="#fbcfe8" text-anchor="middle">WHERE ID > :lastId</text>
    <text x="105" y="155" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Nhanh gấp 100 lần offset</text>

    <rect x="20" y="190" width="170" height="90" rx="10" fill="#0f172a" stroke="#db2777" />
    <text x="105" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">SXSSFWorkbook (RAM 1000)</text>
    <text x="105" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">Flush định kỳ ra disk</text>
    <text x="105" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Không bao giờ OOM</text>

    <rect x="20" y="295" width="170" height="100" rx="10" fill="#0f172a" stroke="#db2777" />
    <text x="105" y="325" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Progress % Realtime</text>
    <text x="105" y="348" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Redis PubSub -> WS</text>
    <text x="105" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Bắn tiến độ % xuống FE</text>
  </g>

  <!-- Node 5: MinIO S3 & Oracle DB -->
  <g transform="translate(960, 140)">
    <rect width="180" height="420" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" />
    <text x="90" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">STORAGE &amp; DB</text>

    <rect x="15" y="80" width="150" height="145" rx="10" fill="#0f172a" stroke="#d97706" />
    <text x="90" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">MinIO S3 Storage</text>
    <text x="90" y="135" font-family="monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">bucket: /exports</text>
    <text x="90" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Upload trực tiếp byte</text>
    <text x="90" y="185" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Presigned URL (15m)</text>

    <rect x="15" y="245" width="150" height="150" rx="10" fill="#0f172a" stroke="#d97706" />
    <text x="90" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">Oracle / Postgres DB</text>
    <text x="90" y="300" font-family="monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">TRANSACTION_LOG</text>
    <text x="90" y="325" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">(1.000.000+ rows)</text>
    <text x="90" y="350" font-family="monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">EXPORT_JOB</text>
  </g>

  <!-- Connectors -->
  <line x1="240" y1="210" x2="290" y2="210" stroke="#3b82f6" stroke-width="2" />
  <line x1="500" y1="290" x2="540" y2="290" stroke="#10b981" stroke-width="2" />
  <line x1="670" y1="290" x2="710" y2="290" stroke="#a855f7" stroke-width="2" />
  <line x1="920" y1="210" x2="960" y2="210" stroke="#f59e0b" stroke-width="2" />
  <line x1="920" y1="360" x2="960" y2="360" stroke="#f59e0b" stroke-width="2" />

  <!-- Bottom File Replacement Guide -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="626" font-family="monospace" font-size="13" fill="#38bdf8">💡 Để thay bằng ảnh thật của bạn:</text>
  <text x="320" y="626" font-family="monospace" font-size="13" fill="#e2e8f0">Chép file ảnh của bạn đè lên đường dẫn: </text>
  <text x="645" y="626" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">e:\portfolio\public\projects\payment-hub\architecture.svg (hoặc .png)</text>
</svg>
