<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827" />
    </marker>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="675" fill="#ffffff" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2" />

  <!-- Header Title Bar -->
  <rect x="20" y="20" width="1160" height="70" rx="12" fill="#f9fafb" stroke="#111827" stroke-width="2" />
  <line x1="20" y1="90" x2="1180" y2="90" stroke="#111827" stroke-width="2" />

  <text x="50" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#111827">SƠ ĐỒ LUỒNG XỬ LÝ - KIẾN TRÚC HIỆU NĂNG CAO NEXT.JS 16 &amp; GPU 3D</text>
  <text x="50" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4b5563">Quy trình biên dịch Turbopack, tối ưu hóa 3D Tilt 60 FPS trên GPU và Suspense Streaming</text>

  <rect x="1000" y="38" width="150" height="34" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="1075" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">WORKFLOW PIPELINE</text>

  <!-- STEP 1: VISITOR HIT URL -->
  <g transform="translate(50, 120)">
    <rect width="210" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="210" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 1: TRUY CẬP ĐỊA CHỈ</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827">• Người dùng truy cập Web</text>
    <text x="15" y="75" font-family="monospace" font-size="11" fill="#4b5563">GET / (tiendat.vercel.app)</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#111827">• Gửi request tới Edge CDN</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="260" y1="175" x2="330" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 2: VERCEL EDGE & PPR -->
  <g transform="translate(330, 120)">
    <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="240" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="120" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 2: VERCEL EDGE &amp; SSR</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Static HTML Shell được nạp</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• TTFB cực nhanh: &lt; 150ms</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#111827">• Partial Prerendering (PPR)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="570" y1="175" x2="640" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 3: HYDRATION & ISOLATED HOOKS -->
  <g transform="translate(640, 120)">
    <rect width="230" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="230" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="115" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 3: HYDRATION NHẸ NHÀNG</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• React 19 Client Components</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Gắn kết Event Listeners chuột</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#4b5563">• Không chặn tiến trình render</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="870" y1="175" x2="940" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 4: MOUSE EVENT LISTENER -->
  <g transform="translate(940, 120)">
    <rect width="210" height="110" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="210" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 4: THEO DÕI CON TRỎ</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Bắt tọa độ (clientX, clientY)</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Chuẩn hóa tâm [-1, 1]</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4b5563">✔ Không tốn tài nguyên CPU</text>
  </g>

  <!-- Arrow 4 down to Step 5 -->
  <path d="M 1045 230 L 1045 370 L 980 370" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- STEP 5: GPU 3D TRANSFORMS -->
  <g transform="translate(680, 310)">
    <rect width="300" height="120" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="300" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="150" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 5: GPU 3D TRANSFORMS</text>
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#111827">rotateX = -y * maxTilt; rotateY = x * maxTilt</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Tính góc bóng sáng Glare Overlay</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#111827">• Áp dụng CSS `transform-gpu`</text>
    <text x="15" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4b5563">✔ Tối ưu chuyển động 60 FPS mượt mà</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="680" y1="370" x2="610" y2="370" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 6: INTERACTIVE TERMINAL & CONFETTI -->
  <g transform="translate(360, 310)">
    <rect width="250" height="120" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="250" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="125" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 6: TERMINAL &amp; CONFETTI</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Parser lệnh Linux (help, skills...)</text>
    <text x="15" y="75" font-family="monospace" font-size="11" fill="#4b5563">Khi gõ: sudo hire</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#111827">• Dynamic import canvas-confetti</text>
    <text x="15" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#111827">✔ Bắn pháo hoa ăn mừng tức thì</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="360" y1="370" x2="280" y2="370" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 7: DYNAMIC CASE STUDY & LIGHTBOX -->
  <g transform="translate(50, 310)">
    <rect width="230" height="120" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect width="230" height="30" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.5" />
    <text x="115" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">BƯỚC 7: CASE STUDY &amp; MODAL</text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Điều hướng route tĩnh</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#111827">• Phóng to sơ đồ kỹ thuật Lightbox</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#111827">• Copy Code Snippet một chạm</text>
    <text x="15" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4b5563">✔ Trải nghiệm liền mạch không giật</text>
  </g>

  <!-- Design System Note Box -->
  <g transform="translate(50, 470)">
    <rect width="1100" height="85" rx="8" fill="#fafafa" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#111827">THIẾT KẾ GIAO DIỆN CYBER EMERALD &amp; TỐI ƯU DUNG LƯỢNG:</text>
    <text x="25" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#374151">• Hạn chế sử dụng thư viện bên ngoài để trang web tải nhanh và nhẹ hơn.</text>
    <text x="25" y="73" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">• Các hiệu ứng chuyển động được tối ưu bằng CSS Transform kết hợp tăng tốc phần cứng của GPU.</text>
  </g>

  <!-- Footer Technical Indicators -->
  <line x1="50" y1="585" x2="1150" y2="585" stroke="#e5e7eb" stroke-width="1.5" />
  <g transform="translate(50, 605)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">CHỈ SỐ THỰC TẾ:</text>
    <text x="140" y="15" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">Lighthouse Performance: 100/100</text>
    <text x="440" y="15" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">FPS khi di chuyển chuột: 60 FPS ổn định</text>
    <text x="770" y="15" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">Thời gian phản hồi lệnh Terminal: &lt; 5ms</text>
  </g>
</svg>

