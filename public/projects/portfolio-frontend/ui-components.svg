  <text x="220" y="626" font-family="monospace" font-size="13" fill="#e2e8f0">Đường dẫn: </text>
  <text x="320" y="626" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">e:\portfolio\public\projects\portfolio-frontend\ui-components.svg</text>
