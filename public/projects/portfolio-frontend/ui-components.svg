<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120d" /><stop offset="50%" stop-color="#0a1913" /><stop offset="100%" stop-color="#040b08" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f261d" /><stop offset="100%" stop-color="#071711" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#133628" stroke-width="0.8" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#1e4d3a" stroke-width="1.5" />
  <text x="75" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#34d399">🎨</text>
  <text x="110" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">KIẾN TRÚC THÀNH PHẦN GIAO DIỆN &amp; HIỆU ỨNG TƯƠNG TÁC (DESIGN SYSTEM)</text>
  <text x="110" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#a7f3d0">3D Tilt Parallax Card, Interactive Terminal, ScrambleText Hacker &amp; Command Palette (Ctrl+K)</text>

  <!-- 4 Component Cards Grid -->
  <!-- Comp 1: 3D Tilt Card -->
  <g transform="translate(60, 130)">
    <rect width="255" height="430" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <rect x="20" y="20" width="215" height="32" rx="8" fill="#047857" fill-opacity="0.2" />
    <text x="127" y="41" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">1. TiltCard (3D Glare)</text>
    
    <rect x="25" y="70" width="205" height="150" rx="12" fill="#071711" stroke="#1e4d3a" />
    <path d="M 60 170 L 127 110 L 195 170 Z" fill="#059669" fill-opacity="0.3" stroke="#10b981" />
    <circle cx="150" cy="115" r="15" fill="#f59e0b" />
    <text x="127" y="200" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">rotateX(deg) rotateY(deg)</text>

    <text x="25" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Đặc tính kỹ thuật:</text>
    <text x="25" y="275" font-family="monospace" font-size="11" fill="#94a3b8">• CSS 3D Transform</text>
    <text x="25" y="300" font-family="monospace" font-size="11" fill="#94a3b8">• Radial Glare overlay</text>
    <text x="25" y="325" font-family="monospace" font-size="11" fill="#94a3b8">• 60fps GPU Hardware Accel</text>
    <text x="25" y="350" font-family="monospace" font-size="11" fill="#94a3b8">• Không phụ thuộc library ngoài</text>
    <text x="25" y="390" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399">✅ Mượt mà trên Mobile &amp; PC</text>
  </g>

  <!-- Comp 2: Interactive Terminal -->
  <g transform="translate(345, 130)">
    <rect width="255" height="430" rx="18" fill="url(#cardGrad)" stroke="#14b8a6" stroke-width="1.5" />
    <rect x="20" y="20" width="215" height="32" rx="8" fill="#0f766e" fill-opacity="0.2" />
    <text x="127" y="41" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2dd4bf" text-anchor="middle">2. Interactive Terminal</text>

    <rect x="25" y="70" width="205" height="150" rx="12" fill="#071711" stroke="#134e4a" />
    <rect x="25" y="70" width="205" height="24" rx="12" fill="#134e4a" />
    <circle cx="40" cy="82" r="4" fill="#ef4444" />
    <circle cx="52" cy="82" r="4" fill="#f59e0b" />
    <circle cx="64" cy="82" r="4" fill="#10b981" />
    <text x="35" y="115" font-family="monospace" font-size="10" fill="#2dd4bf">> help</text>
    <text x="35" y="135" font-family="monospace" font-size="9" fill="#e2e8f0">[COMMANDS] skills, projects</text>
    <text x="35" y="155" font-family="monospace" font-size="10" fill="#f43f5e">> sudo hire dat</text>
    <text x="35" y="175" font-family="monospace" font-size="9" fill="#facc15">🎉 Confetti Fireworks!</text>

    <text x="25" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Đặc tính kỹ thuật:</text>
    <text x="25" y="275" font-family="monospace" font-size="11" fill="#94a3b8">• Lịch sử lệnh (Arrow Up/Down)</text>
    <text x="25" y="300" font-family="monospace" font-size="11" fill="#94a3b8">• Canvas Confetti particle</text>
    <text x="25" y="325" font-family="monospace" font-size="11" fill="#94a3b8">• Phím tắt chip tiện lợi</text>
    <text x="25" y="350" font-family="monospace" font-size="11" fill="#94a3b8">• Cuộn nội bộ chống giật trang</text>
    <text x="25" y="390" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2dd4bf">✅ Gây ấn tượng mạnh với HR</text>
  </g>

  <!-- Comp 3: Command Palette -->
  <g transform="translate(630, 130)">
    <rect width="255" height="430" rx="18" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="20" y="20" width="215" height="32" rx="8" fill="#1d4ed8" fill-opacity="0.2" />
    <text x="127" y="41" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">3. Command Palette (Ctrl+K)</text>

