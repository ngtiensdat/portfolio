    <rect x="35" y="125" width="185" height="24" rx="6" fill="#1d4ed8" fill-opacity="0.3" />
    <text x="50" y="141" font-family="monospace" font-size="9" fill="#fff">⚡ Xem CV chuẩn ATS</text>
    <rect x="35" y="155" width="185" height="24" rx="6" fill="#0f172a" />
    <text x="50" y="171" font-family="monospace" font-size="9" fill="#94a3b8">📄 Case Study FOOD AI</text>

    <text x="25" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Đặc tính kỹ thuật:</text>
    <text x="25" y="275" font-family="monospace" font-size="11" fill="#94a3b8">• Toàn cầu phím tắt Ctrl+K</text>
    <text x="25" y="300" font-family="monospace" font-size="11" fill="#94a3b8">• Lọc mờ (Fuzzy Search)</text>
    <text x="25" y="325" font-family="monospace" font-size="11" fill="#94a3b8">• Chuyển Dark/Light Mode</text>
    <text x="25" y="350" font-family="monospace" font-size="11" fill="#94a3b8">• 1-click chép SĐT / Email</text>
    <text x="25" y="390" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#60a5fa">✅ Trải nghiệm như macOS Spotlight</text>
  </g>

  <!-- Comp 4: Case Study & ATS CV -->
  <g transform="translate(915, 130)">
    <rect width="230" height="430" rx="18" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="15" y="20" width="200" height="32" rx="8" fill="#7e22ce" fill-opacity="0.2" />
    <text x="115" y="41" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">4. Case Studies &amp; ATS CV</text>

    <rect x="20" y="70" width="190" height="150" rx="12" fill="#071711" stroke="#581c87" />
    <text x="115" y="110" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">📄</text>
    <text x="115" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">/projects/[slug]</text>
    <text x="115" y="170" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">&amp; /cv (Print Ready)</text>

    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Đặc tính kỹ thuật:</text>
    <text x="20" y="275" font-family="monospace" font-size="11" fill="#94a3b8">• SSR &amp; Static Generation</text>
    <text x="20" y="300" font-family="monospace" font-size="11" fill="#94a3b8">• Sơ đồ Lightbox phóng to</text>
    <text x="20" y="325" font-family="monospace" font-size="11" fill="#94a3b8">• Sao chép code 1-chạm</text>
    <text x="20" y="350" font-family="monospace" font-size="11" fill="#94a3b8">• In ấn khổ giấy A4 chuẩn ATS</text>
    <text x="20" y="390" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#c084fc">✅ Trình diễn năng lực kỹ thuật</text>
  </g>

  <!-- Bottom File Replacement Guide -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#0f261d" stroke="#1e4d3a" stroke-width="1"/>
