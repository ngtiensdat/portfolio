    <text x="40" y="98" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Turbopack Bundler</text>
    <text x="40" y="123" font-family="monospace" font-size="11" fill="#60a5fa">✓ Compiled in &lt; 900ms</text>
    <text x="40" y="145" font-family="monospace" font-size="11" fill="#93c5fd">✓ TypeScript Check in 1.9s</text>

    <rect x="25" y="180" width="270" height="95" rx="12" fill="#071711" stroke="#1e3a8a" />
    <text x="40" y="208" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Suspense Streaming</text>
    <text x="40" y="233" font-family="monospace" font-size="11" fill="#34d399">✓ Zero URL data blocking</text>
    <text x="40" y="255" font-family="monospace" font-size="11" fill="#a7f3d0">✓ Instant page navigation</text>

    <rect x="25" y="290" width="270" height="100" rx="12" fill="#071711" stroke="#1e3a8a" />
    <text x="40" y="318" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Assets &amp; Fonts</text>
    <text x="40" y="343" font-family="monospace" font-size="10" fill="#94a3b8">• Geist Sans &amp; Geist Mono</text>
    <text x="40" y="365" font-family="monospace" font-size="10" fill="#94a3b8">• Preloaded vector SVGs</text>
  </g>

  <!-- Bottom File Replacement Guide -->
  <rect x="40" y="595" width="1120" height="50" rx="12" fill="#0f261d" stroke="#1e4d3a" stroke-width="1"/>
  <text x="60" y="626" font-family="monospace" font-size="13" fill="#34d399">💡 Vị trí file ảnh:</text>
  <text x="220" y="626" font-family="monospace" font-size="13" fill="#e2e8f0">Đường dẫn: </text>
  <text x="320" y="626" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15">e:\portfolio\public\projects\portfolio-frontend\architecture.svg</text>
