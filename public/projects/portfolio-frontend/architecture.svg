    <text x="160" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">APP ROUTER (Next.js 16)</text>
    
    <rect x="25" y="70" width="270" height="60" rx="12" fill="#071711" stroke="#1e4d3a" />
    <text x="40" y="95" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">src/app/page.tsx</text>
    <text x="40" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Trang chủ: Hero, About, Skills, Projects...</text>

    <rect x="25" y="145" width="270" height="60" rx="12" fill="#071711" stroke="#10b981" />
    <text x="40" y="170" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">src/app/projects/[slug]</text>
    <text x="40" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#a7f3d0">Case Study chi tiết 4 dự án thực tế</text>

    <rect x="25" y="220" width="270" height="60" rx="12" fill="#071711" stroke="#1e4d3a" />
    <text x="40" y="245" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">src/app/cv/page.tsx</text>
    <text x="40" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Bản CV chuyên nghiệp chuẩn A4 ATS</text>

    <rect x="25" y="295" width="270" height="95" rx="12" fill="#071711" stroke="#1e4d3a" />
    <text x="40" y="320" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">SEO &amp; Crawlers:</text>
    <text x="40" y="345" font-family="monospace" font-size="11" fill="#94a3b8">• sitemap.ts (Tự sinh URL động)</text>
    <text x="40" y="370" font-family="monospace" font-size="11" fill="#94a3b8">• robots.ts &amp; OpenGraph Meta</text>
