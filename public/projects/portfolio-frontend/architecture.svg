<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120d" /><stop offset="50%" stop-color="#0a1913" /><stop offset="100%" stop-color="#040b08" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f261d" /><stop offset="100%" stop-color="#071711" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#133628" stroke-width="0.8" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#1e4d3a" stroke-width="1.5" />
  <text x="75" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#34d399">⚡</text>
  <text x="110" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">KIẾN TRÚC FRONTEND NEXT.JS 16 &amp; TAILWIND CSS V4</text>
  <text x="110" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#a7f3d0">Cơ chế Static Prerendering (generateStaticParams), Suspense Streaming &amp; Turbopack Engine</text>

  <!-- 3 Big Architecture Layers -->
  <!-- Layer 1: App Router & Routes -->
  <g transform="translate(60, 140)">
