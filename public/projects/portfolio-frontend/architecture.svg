    <rect x="25" y="160" width="310" height="75" rx="12" fill="#071711" stroke="#134e4a" />
    <text x="40" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Terminal &amp; Command Palette</text>
    <text x="40" y="208" font-family="monospace" font-size="10" fill="#2dd4bf">• InteractiveTerminal + Confetti</text>
    <text x="40" y="225" font-family="monospace" font-size="10" fill="#2dd4bf">• CommandPalette (Global Ctrl+K)</text>

    <rect x="25" y="250" width="310" height="140" rx="12" fill="#071711" stroke="#134e4a" />
    <text x="40" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Design Tokens &amp; Tailwind v4</text>
    <text x="40" y="300" font-family="monospace" font-size="10" fill="#94a3b8">• Cyber Emerald Color System</text>
    <text x="40" y="322" font-family="monospace" font-size="10" fill="#94a3b8">• Dark/Light Mode Theme Provider</text>
    <text x="40" y="344" font-family="monospace" font-size="10" fill="#94a3b8">• Glassmorphism backdrop-blur-xl</text>
    <text x="40" y="366" font-family="monospace" font-size="10" fill="#94a3b8">• CSS Custom Scrollbars</text>
  </g>

  <!-- Layer 3: Performance & Turbopack -->
  <g transform="translate(820, 140)">
    <rect width="320" height="420" rx="20" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2" />
    <text x="160" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#60a5fa" text-anchor="middle">OPTIMIZATION &amp; BUILD</text>

