<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad2)"/>
  
  <!-- Borders -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#0284c7" stroke-width="4" rx="8"/>
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="6" stroke-dasharray="6,4"/>

  <!-- Top Ribbon -->
  <rect x="200" y="55" width="400" height="40" rx="8" fill="#0369a1"/>
  <text x="400" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ONECONNECT ENTERPRISE
  </text>

  <!-- Title -->
  <text x="400" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="900" fill="#0f172a" text-anchor="middle">
    CHỨNG NHẬN THỰC TẬP TỐT NGHIỆP
  </text>
  <text x="400" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1">
    ON-THE-JOB TRAINING CERTIFICATE OF EXCELLENCE
  </text>

  <!-- Recipient Box -->
  <rect x="120" y="210" width="560" height="130" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="400" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0284c7" text-anchor="middle" letter-spacing="1">
    CHỨNG NHẬN SINH VIÊN
  </text>
  <text x="400" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="900" fill="#0369a1" text-anchor="middle">
    NGUYỄN TIẾN ĐẠT
  </text>
  <text x="400" y="315" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">
    Đã hoàn thành xuất sắc chương trình Thực tập Phần mềm tại Công ty OneConnect
  </text>

  <!-- Details -->
  <g transform="translate(160, 365)">
    <rect x="0" y="0" width="480" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="120" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">VỊ TRÍ THỰC TẬP</text>
    <text x="120" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Software Engineer</text>
    
    <line x1="240" y1="15" x2="240" y2="75" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="360" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">KẾT QUẢ ĐÁNH GIÁ</text>
    <text x="360" y="65" font-family="sans-serif" font-size="18" font-weight="900" fill="#0284c7" text-anchor="middle">XUẤT SẮC</text>
  </g>

  <!-- Footer -->
  <text x="400" y="515" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Xác nhận thực tập doanh nghiệp • Đại học Phenikaa &amp; OneConnect
  </text>
</svg>
